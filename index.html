<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meevo Sales Training Needs Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ocean:#204855; --ocean-mid:#216479; --ocean-light:#A6C1C9; --ocean-tint:#E4ECEF;
  --terra:#A75F37; --terra-mid:#E29D63; --terra-light:#F3D8C1;
  --mauve:#4B3951; --mauve-mid:#806C85; --mauve-light:#CCC4CE;
  --sage:#9A997B; --sage-light:#D7D6CA; --rose:#BF9982; --rose-light:#D9C2B4;
  --charcoal:#232426; --ink2:#444444; --ink3:#6B6B6B; --line:#E3E1DC; --ivory:#F8F7F5; --white:#fff;
  --good:#2E7D5B; --warn:#8A6508; --danger:#A3412F;
  --radius:14px; --shadow:0 2px 10px rgba(35,36,38,.07);
  font-family:"Source Sans 3","Source Sans Pro",Calibri,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--charcoal);font-size:16px;line-height:1.45}
a{color:var(--ocean-mid)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--charcoal)}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px}

/* header */
header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;color:var(--ocean);text-decoration:none;font-size:17px}
.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--terra)}
.logo small{font-weight:600;color:var(--ink3);font-size:13px;margin-left:4px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--white);color:var(--charcoal);border-radius:10px;padding:9px 16px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--ocean-light);background:var(--ocean-tint)}
.btn.primary{background:var(--ocean);border-color:var(--ocean);color:#fff}
.btn.primary:hover{background:var(--ocean-mid)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--ocean-tint)}
.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:14px}

main{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
.notice{background:var(--terra-light);border:1px solid #E7C4A5;color:#5F3A1F;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.notice b{font-weight:700}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:34px;align-items:center;margin-bottom:34px}
.hero h1{font-size:38px;line-height:1.12;margin:0 0 14px;color:var(--ocean)}
.hero p{font-size:17px;color:var(--ink2);margin:0 0 12px;max-width:56ch}
.scale-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.scale-card h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3)}
.scale-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.scale-row:first-of-type{border-top:0}
.scale-row .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.scale-row b{display:block;font-weight:600}
.scale-row span{color:var(--ink3);font-size:14px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);text-align:left;position:relative;overflow:hidden;transition:.18s;display:flex;flex-direction:column;gap:8px}
.panel:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(35,36,38,.12)}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
.panel .abbr{font-size:34px;font-weight:700;color:var(--accent);line-height:1}
.panel h2{margin:0;font-size:20px}
.panel p{margin:0;color:var(--ink2);font-size:15px}
.panel .meta{margin-top:auto;font-size:13px;color:var(--ink3);display:flex;gap:12px;padding-top:8px}
.panel .go{color:var(--accent);font-weight:700;font-size:15px}
.how{margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.how div{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.how h4{margin:0 0 4px;color:var(--ocean);font-size:16px}
.how p{margin:0;color:var(--ink2);font-size:15px}
.footnote{margin-top:28px;font-size:14px;color:var(--ink3)}

/* assessment */
.crumbs{font-size:14px;color:var(--ink3);margin-bottom:10px}
.crumbs a{text-decoration:none;color:var(--ocean-mid)}
.title-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.title-row h1{margin:0;font-size:30px;color:var(--accent,var(--ocean))}
.title-row p{margin:0;color:var(--ink2)}
.identity{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.identity label{font-size:13px;font-weight:600;color:var(--ink3);display:block;margin-bottom:4px}
.rep-actions{display:flex;gap:8px;margin-top:10px}
.danger-btn{color:#A3412F!important;border-color:#A3412F!important}
.identity input,.identity select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--ivory);font:inherit;color:inherit}
.identity input:focus,.identity select:focus,textarea:focus{outline:2px solid var(--ocean-light);outline-offset:1px;border-color:var(--ocean-light)}

/* meter */
.meter-wrap{position:sticky;top:61px;z-index:20;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 20px;box-shadow:var(--shadow);margin-bottom:22px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.meter-wrap .hero-num{font-size:48px;font-weight:700;line-height:1;color:var(--charcoal);min-width:110px}
.meter-wrap .hero-num small{font-size:18px;color:var(--ink3);font-weight:600}
.meter-wrap .label{font-size:14px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.track{height:14px;border-radius:8px;background:var(--ocean-tint);position:relative;overflow:hidden}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--ocean);transition:width .35s ease, background .35s}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:4px}
.band{font-weight:700;font-size:15px;margin-top:6px}
.progress{text-align:right;font-size:14px;color:var(--ink3)}
.progress b{display:block;font-size:22px;color:var(--charcoal)}
.stage-mini{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.stage-mini span{font-size:12.5px;color:var(--ink2);background:var(--ivory);border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center}
.stage-mini i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line)}

/* questions */
.stage{margin:26px 0 14px}
.stage h2{font-size:21px;margin:0;color:var(--charcoal);display:flex;align-items:center;gap:10px}
.stage h2 .num{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.stage p{margin:4px 0 0 40px;color:var(--ink3);font-size:14.5px}
.q{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
.q.done{border-color:var(--ocean-light)}
.q .qt{font-size:17px;font-weight:600;margin:0 0 12px;display:flex;gap:10px}
.q .qt .idx{color:var(--ink3);font-weight:600;min-width:28px}
.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.rating button{border:1.5px solid var(--line);background:var(--ivory);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.12s;color:var(--charcoal)}
.rating button .v{font-size:20px;font-weight:700}
.rating button .t{font-size:11.5px;color:var(--ink3);line-height:1.15;text-align:center}
.rating button:hover{border-color:var(--ocean-light);background:var(--ocean-tint)}
.rating button.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.rating button.sel .t{color:rgba(255,255,255,.85)}
.q textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--ivory);resize:vertical}
.q .why{font-size:13px;color:var(--ink3);font-weight:600;margin:0 0 5px}
.extras{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:26px;box-shadow:var(--shadow)}
.extras h2{margin:0 0 6px;font-size:21px}
.extras p{margin:0 0 12px;color:var(--ink2)}
.prio{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px}
.prio select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--ivory);width:100%}
.extras textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--ivory)}
.submit-row{display:flex;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap}
.submit-row .hint{color:var(--ink3);font-size:14px}
.err{color:var(--danger);font-weight:600}

/* confirmation */
.confirm{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.confirm h1{margin:0 0 6px;color:var(--ocean);font-size:30px}
.confirm .sub{color:var(--ink2);margin:0 0 20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.card{background:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3)}
.hbar{display:grid;grid-template-columns:minmax(160px,1.5fr) 1fr 36px;gap:10px;align-items:center;font-size:14.5px;padding:5px 0}
.hbar .bg{height:10px;background:var(--ocean-tint);border-radius:6px;overflow:hidden}
.hbar .bg i{display:block;height:100%;background:var(--ocean);border-radius:6px}
.hbar .val{font-weight:700;text-align:right}
.list li{margin:4px 0;font-size:15px}

/* admin */
.login{max-width:440px;margin:50px auto;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.login h1{margin:0 0 6px;font-size:26px;color:var(--ocean)}
.login p{margin:0 0 16px;color:var(--ink2)}
.login input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--ivory);margin-bottom:12px}
.admin-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.admin-head h1{margin:0;font-size:28px;color:var(--ocean)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select,.filters input{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--white)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ocean);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.tile{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.tile .l{font-size:13px;color:var(--ink3);font-weight:600}
.tile .v{font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.tile .d{font-size:13px;color:var(--ink3);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.box{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.box h2{margin:0 0 4px;font-size:18px}
.box .sub{margin:0 0 12px;font-size:14px;color:var(--ink3)}
.heat{overflow:auto}
.heat table{border-collapse:separate;border-spacing:2px;font-size:13px;min-width:100%}
.heat th{font-weight:600;color:var(--ink2);text-align:left;padding:4px 6px;white-space:nowrap;background:var(--ivory);position:sticky;top:0}
.heat th.rot{max-width:120px;white-space:normal;vertical-align:bottom;font-size:12px;line-height:1.15}
.heat td{padding:0;text-align:center;border-radius:4px;min-width:42px;height:34px;font-weight:600;cursor:default}
.heat td.lab{text-align:left;padding:0 8px;font-weight:600;background:var(--ivory);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.heat td.avg{font-weight:700}
.legend{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3);margin-top:10px}
.legend i{width:26px;height:12px;border-radius:3px;display:inline-block}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rep{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--ivory);cursor:pointer;transition:.12s}
.rep:hover{border-color:var(--ocean-light);background:var(--ocean-tint)}
.rep .n{font-weight:700}
.rep .m{font-size:13px;color:var(--ink3)}
.rep .s{font-size:26px;font-weight:700;margin-top:4px}
table.detail{width:100%;border-collapse:collapse;font-size:14.5px}
table.detail th{text-align:left;font-size:13px;color:var(--ink3);padding:8px 6px;border-bottom:1px solid var(--line)}
table.detail td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.detail td.sc{font-weight:700;text-align:center;width:50px;border-radius:6px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.tooltip{position:fixed;pointer-events:none;background:var(--charcoal);color:#fff;font-size:13px;padding:8px 10px;border-radius:8px;max-width:320px;z-index:99;box-shadow:0 6px 18px rgba(0,0,0,.2);line-height:1.35}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media (max-width:860px){
  .hero,.how,.identity,.two,.grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .meter-wrap{grid-template-columns:1fr;gap:10px}
  .rating button .t{display:none}
  .hero h1{font-size:30px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#/"><span class="dot"></span>Meevo <small>Sales Training Needs Analysis</small></a>
    <div class="spacer"></div>
    <a class="btn ghost sm" href="#/" id="navHome">Home</a>
    <a class="btn sm" href="#/admin" id="navAdmin" target="_blank" rel="noopener">Manager login</a>
  </div>
</header>
<main id="app"></main>
<div id="tooltip" class="tooltip hidden"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  // Paste your Apps Script Web App URL here (ends in /exec). Leave empty to run in demo mode.
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyU-XxzTR5Tn_zAhJV-aJQSzJn58nlGjTWqL_JuB9oPRad3vRYermsR9xF5hXcFT2pE/exec",
  // Demo mode only: password for the manager view when no backend is configured.
  DEMO_ADMIN_PASSWORD: "meevo",
  ORG_NAME: "Meevo",
  // Managers by role (shown in the rep form) plus Sales Enablement, who are offered to every role.
  MANAGERS_BY_ROLE: { SDR: ["Avery Baccala"], AE: ["Melanie Hull", "Taylor Meeker"], SE: [], CSM: [] },
  ENABLEMENT: ["Terry Moorehead", "Nicole Fabre"],
  get MANAGERS(){ return [...new Set([...Object.values(this.MANAGERS_BY_ROLE).flat(), ...this.ENABLEMENT])]; }
};
</script>
<script>
/* =========================================================
   RATING SCALE
   ========================================================= */
const SCALE = [
  { v:1, short:"Needs training",  long:"I avoid this or need step by step help. Foundational training needed." },
  { v:2, short:"Developing",      long:"I can do it with coaching or prep, but it is inconsistent on live calls." },
  { v:3, short:"Competent",       long:"I do this reliably in most conversations without help." },
  { v:4, short:"Strong",          long:"I do this well under pressure and it drives results." },
  { v:5, short:"Can coach others",long:"I am a go to example for this and could run a session on it." }
];
const BANDS = [
  { max:1.99, label:"Foundational training needed", color:"#A3412F" },
  { max:2.99, label:"Developing, coaching priority", color:"#8A6508" },
  { max:3.99, label:"Competent, sharpen the edges", color:"#216479" },
  { max:5.01, label:"Strong, ready to coach others", color:"#2E7D5B" }
];

/* =========================================================
   ROLES AND QUESTIONS
   Each question: id, text, and optional "why it matters" hint.
   Edit freely. IDs must stay unique within a role.
   ========================================================= */
const ROLES = {
  SDR: {
    key:"SDR", name:"Sales Development Rep", abbr:"SDR", accent:"#204855",
    tagline:"Prospecting, cold calling, qualifying, and booking quality meetings.",
    stages:[
      { name:"Cold Calling", why:"Earning 30 seconds and leading with a problem, not a pitch.", questions:[
        { id:"sdr-4", text:"Open a cold call with confidence and earn the first 30 seconds without sounding scripted." },
        { id:"sdr-5", text:"Lead with a relevant problem or insight for their business type." },
        { id:"sdr-6", text:"Handle a brush off (send me an email, not interested, we are happy) and keep the conversation going." },
        { id:"sdr-7", text:"Control the call: ask one strong question, listen, deep dive question and steer toward a meeting." },
        { id:"sdr-8", text:"Leave a voicemail that earns a call back or sets up the next touch." }
      ]},
      { name:"Email & Multi-channel", why:"Short, personal, and consistent beats long and generic.", questions:[
        { id:"sdr-9", text:"Write short, personalized emails that earn replies." },
        { id:"sdr-10", text:"Run a structured multi-touch cadence (call, email, voicemail, social) consistently." }
      ]},
      { name:"Qualification & Discovery", why:"Meetings that convert come from real pain and a real reason to change.", questions:[
        { id:"sdr-11", text:"Ask discovery questions that surface pain around bookings, no-shows, front desk workload, memberships, payments, or reporting." },
        { id:"sdr-12", text:"Qualify authority, timing, and current software or contract status before booking." },
        { id:"sdr-13", text:"Explain why Meevo is worth a demo in the prospect's own language, not ours." }
      ]},
      { name:"Objection Handling", why:"Most meetings are won after the first no.", questions:[
        { id:"sdr-14", text:"Handle 'we are locked in a contract' or 'we are happy with our current software'." },
        { id:"sdr-15", text:"Handle 'too expensive', 'not right now', or 'just send me information'." }
      ]},
      { name:"Booking & Handoff", why:"A booked meeting is only a win if it shows up and the AE is set up to succeed.", questions:[
        { id:"sdr-16", text:"Create urgency to lock a specific day and time instead of 'sometime next week'." },
        { id:"sdr-17", text:"Confirm meetings and follow a process that reduces no-shows." },
        { id:"sdr-18", text:"Hand off to the AE with complete context: pain, stakeholders, competitor, timeline." }
      ]},
      { name:"Pipeline Discipline & Metrics", why:"Knowing your numbers is how you know what to work on.", questions:[
        { id:"sdr-19", text:"Keep CRM notes, activity, and next steps accurate and current." }
      ]}
    ]
  },

  AE: {
    key:"AE", name:"Account Executive", abbr:"AE", accent:"#A75F37",
    tagline:"Discovery, tailored demos, business case, buying committee, and closing.",
    stages:[
      { name:"Pre-call Planning", why:"Walking in with a point of view sets the tone for the whole deal.", questions:[
        { id:"ae-1", text:"Prepare for a first call with a point of view on their business and a clear goal for the call." },
        { id:"ae-2", text:"Set an agenda and upfront contract: what we will cover, how long, and what happens next." }
      ]},
      { name:"Discovery", why:"Deals are won or lost here. Depth of pain and a number attached to it.", questions:[
        { id:"ae-3", text:"Uncover business goals and the gap between where they are and where they want to be." },
        { id:"ae-4", text:"Dig into operational pain (front desk workload, no-shows, scheduling, inventory, reporting) with second and third level questions." },
        { id:"ae-5", text:"Quantify the challenge." },
        { id:"ae-6", text:"Learn the decision process, stakeholders, timeline, and budget without sounding like a checklist." },
        { id:"ae-7", text:"Uncover current software contract status and switching concerns (data migration, staff retraining)." }
      ]},
      { name:"Demo & Positioning", why:"A tailored demo tied to what they told you, not a tour.", questions:[
        { id:"ae-9", text:"Use FAB: tie each feature to an advantage and to a business benefit the prospect named." },
        { id:"ae-12", text:"Position adoption, onboarding, training, and support as a strength that reduces switching fear." }
      ]},
      { name:"Business Case & Pricing", why:"Value before price, and hold the line.", questions:[
        { id:"ae-13", text:"Build a value story or ROI that justifies the investment." },
        { id:"ae-14", text:"Present pricing confidently and hold margin without discounting early." }
      ]},

<script>
/* =========================================================
   STORAGE LAYER  (Apps Script backend, or demo mode in browser)
   ========================================================= */
const DEMO = !CONFIG.APPS_SCRIPT_URL;
const LS_KEY = "meevo_tna_demo_submissions";

const api = {
  async submit(sub){
    if (DEMO){
      sub.id = sub.id || cryptoId(); sub.timestamp = new Date().toISOString();
      const all = demoRead().filter(x => x.id !== sub.id); all.push(sub); localStorage.setItem(LS_KEY, JSON.stringify(all));
      return { ok:true, id:sub.id, timestamp:sub.timestamp };
    }
    const r = await fetch(CONFIG.APPS_SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action:"submit", submission: sub }) });
    return r.json();
  },
  async admin(password){
    if (DEMO){
      if (password !== CONFIG.DEMO_ADMIN_PASSWORD) return { ok:false, error:"Invalid password" };
      return { ok:true, submissions: demoRead() };
    }
    const r = await fetch(CONFIG.APPS_SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action:"admin", password }) });
    return r.json();
  },
  async delete(password, id){
    if (DEMO){
      if (password !== CONFIG.DEMO_ADMIN_PASSWORD) return { ok:false, error:"Invalid password" };
      localStorage.setItem(LS_KEY, JSON.stringify(demoRead().filter(x => x.id !== id)));
      return { ok:true };
    }
    const r = await fetch(CONFIG.APPS_SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action:"delete", password, id }) });
    return r.json();
  },
  async mine(email){
    if (DEMO) return { ok:true, submissions: demoRead().filter(s => (s.email||"").toLowerCase() === email.toLowerCase()) };
    const r = await fetch(CONFIG.APPS_SCRIPT_URL + "?action=mine&email=" + encodeURIComponent(email));
    return r.json();
  }
};
function demoRead(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch(e){ return []; } }
function cryptoId(){ return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); }

/* Demo seed so the manager view has something to show */
function seedDemo(){
  if (!DEMO || demoRead().length) return;
  const people = [
    ["Jordan Blake","SDR","Sam Rivera",2.6],["Priya Nair","SDR","Sam Rivera",3.4],["Marcus Lee","SDR","Sam Rivera",3.9],
    ["Alexis Chen","AE","Taylor Morgan",3.1],["Devon Carter","AE","Taylor Morgan",3.8],["Riley Brooks","AE","Taylor Morgan",2.8],
    ["Casey Nguyen","SE","Taylor Morgan",3.6],["Morgan Ellis","SE","Taylor Morgan",4.1],
    ["Jamie Ortiz","CSM","Robin Park",3.3],["Sydney Patel","CSM","Robin Park",2.9]
  ];
  const weak = { SDR:["sdr-6","sdr-14","sdr-15","sdr-16","sdr-7"], AE:["ae-5","ae-14","ae-18","ae-19","ae-21","ae-22"], SE:["se-1","se-9","se-15","se-8"], CSM:["csm-8","csm-11","csm-13","csm-5"] };
  const reasons = ["Still get thrown when they push back.","Comfortable in prep but it slips on live calls.","Do this well with warm leads, less so with cold.","Have had wins here recently.","Need more reps on this, especially with med spas.","Could run a session on this for the team.","Tend to react instead of lead here."];
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const out = [];
  people.forEach(([name, role, mgr, base], i) => {
    const r = ROLES[role]; const qs = [];
    r.stages.forEach(st => st.questions.forEach(q => {
      let s = base + (rnd() - .5) * 2.2; if (weak[role].includes(q.id)) s -= 1.1;
      s = Math.max(1, Math.min(5, Math.round(s)));
      qs.push({ id:q.id, stage:st.name, text:q.text, score:s, reason: rnd() > .45 ? reasons[Math.floor(rnd()*reasons.length)] : "" });
    }));
    const learning = LEARNING.map((l, li) => ({ id:l.id, label:l.label, score: Math.max(1, Math.min(5, Math.round(2 + rnd()*3 + (li===(i%4)?1:0)))), reason: rnd() > .5 ? "This is how most of what I know actually stuck." : "" }));
    const values = VALUES.map((v, vi) => ({ id:v.id, name:v.name, score: Math.max(1, Math.min(5, Math.round(base + 0.4 + (rnd() - .5) * 2 - (vi===1||vi===0 ? 0.6 : 0)))), reason: rnd() > .55 ? "I do this with clients, less so internally." : "" }));
    const sub = buildSubmission({ name, email: name.toLowerCase().replace(" ",".") + "@meevo.com", manager: mgr, role, questions: qs, priorities: weak[role].slice(0,3), comments:"", learning, values });
    sub.id = cryptoId(); sub.timestamp = new Date(Date.now() - (i*2+1) * 86400000).toISOString();
    out.push(sub);
  });
  localStorage.setItem(LS_KEY, JSON.stringify(out));
}

/* =========================================================
   HELPERS
   ========================================================= */
const $ = sel => document.querySelector(sel);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (n == null || isNaN(n)) ? "–" : (Math.round(n * 10) / 10).toFixed(1);
const band = v => BANDS.find(b => v <= b.max) || BANDS[BANDS.length - 1];
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }); };
function avg(arr){ const a = arr.filter(x => typeof x === "number" && !isNaN(x)); return a.length ? a.reduce((p,c)=>p+c,0)/a.length : null; }
function allQuestions(role){ return ROLES[role].stages.flatMap(st => st.questions.map(q => ({ ...q, stage: st.name }))); }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }

/* Sequential ramp for heatmap: 1 (light) -> 5 (dark ocean). One hue, more is darker. */
const HEAT = ["#E4ECEF","#B8CDD5","#7FA6B4","#45788B","#204855"];
function heatColor(v){ if (v == null) return "transparent"; const i = Math.max(0, Math.min(4, Math.round(v) - 1)); return HEAT[i]; }
function heatInk(v){ return (v != null && v >= 3.5) ? "#fff" : "#232426"; }

function buildSubmission({ name, email, manager, role, questions, priorities, comments, learning, values }){
  const stageAverages = {};
  ROLES[role].stages.forEach(st => { stageAverages[st.name] = avg(questions.filter(q => q.stage === st.name).map(q => q.score)); });
  return { name, email, manager, role, questions, priorities, comments, learning: learning || [], values: values || [], valuesOverall: avg((values || []).map(v => v.score)), overall: avg(questions.map(q => q.score)), stageAverages };
}

window.addEventListener("load", () => { seedDemo(); route(); const na = document.getElementById("navAdmin"); if (na) na.href = location.origin + location.pathname + "#/admin"; });
function route(){

        <h3>The rating scale</h3>
        ${SCALE.map((s,i) => `<div class="scale-row"><span class="n" style="background:${HEAT[i]};color:${i>=3?'#fff':'#232426'}">${s.v}</span><div><b>${esc(s.short)}</b><span>${esc(s.long)}</span></div></div>`).join("")}
      </aside>
    </section>
    <h2 style="margin:0 0 12px;font-size:20px">Choose your role</h2>
    <section class="panels">${panels}</section>

}

/* =========================================================

let state = null;
function renderAssessment(roleKey, existing, focusQ){

      <div><div class="label">Overall score</div><div class="hero-num" id="m-num">–<small> / 5</small></div></div>

    Object.entries(state.learnReasons).forEach(([id, r]) => { const t = document.querySelector(`textarea[data-learn="${id}"]`); if (t) t.value = r; });

// Reopen a submission for editing (rep or manager). qid optionally scrolls to one question.
let pendingEdit = null;
function editSubmission(sub, qid){
  if (!sub) return;
  const target = "#/assess/" + sub.role;
  if (location.hash === target){ renderAssessment(sub.role, sub, qid); }
  else { pendingEdit = { sub, qid }; location.hash = target; }
}

function setValue(id, v){
  state.values[id] = v;
  document.querySelectorAll(`button[data-vq="${id}"]`).forEach(b => { const on = +b.dataset.v === v; b.classList.toggle("sel", on); b.setAttribute("aria-checked", on); });
  const el = document.getElementById("vq-" + id); if (el) el.classList.add("done");
  const chip = document.getElementById("m-values"); if (chip){ const a = avg(Object.values(state.values)); chip.querySelector("b").textContent = a == null ? "–" : fmt(a); }
}

function setLearn(id, v){
  state.learning[id] = v;
  document.querySelectorAll(`button[data-lq="${id}"]`).forEach(b => { const on = +b.dataset.v === v; b.classList.toggle("sel", on); b.setAttribute("aria-checked", on); });
  const el = document.getElementById("lq-" + id); if (el) el.classList.add("done");
}

function setScore(qid, v){
  state.scores[qid] = v;
  document.querySelectorAll(`button[data-q="${qid}"]`).forEach(b => { const on = +b.dataset.v === v; b.classList.toggle("sel", on); b.setAttribute("aria-checked", on); });
  document.getElementById("q-" + qid).classList.add("done");
  updateMeter();
}

function updateMeter(){
  const role = ROLES[state.role]; const qs = allQuestions(state.role);
  const vals = Object.values(state.scores); const o = avg(vals);
  const num = $("#m-num"), fill = $("#m-fill"), bd = $("#m-band"), prog = $("#m-prog");
  prog.textContent = `${vals.length} / ${qs.length}`;
  if (o == null){ num.innerHTML = `–<small> / 5</small>`; fill.style.width = "0%"; return; }
  const b = band(o);
  num.innerHTML = `${fmt(o)}<small> / 5</small>`;
  fill.style.width = ((o - 1) / 4 * 100) + "%"; fill.style.background = b.color;
  bd.textContent = b.label; bd.style.color = b.color;
  role.stages.forEach(st => {
    const a = avg(st.questions.map(q => state.scores[q.id]));
    const el = document.querySelector(`#m-stages span[data-stage="${CSS.escape(st.name)}"]`);
    if (!el) return;
    el.querySelector("b").textContent = a == null ? "–" : fmt(a);
    el.querySelector("i").style.background = a == null ? "#E3E1DC" : heatColor(a);
  });
}

async function submitAssessment(){
  const err = $("#submitErr"); err.textContent = "";
  const qs = allQuestions(state.role);
  if (!state.name.trim() || !state.email.trim()) { err.textContent = "Please add your name and work email."; $("#f-name").focus(); return; }
  const missing = qs.filter(q => !state.scores[q.id]);
  if (missing.length){ err.textContent = `${missing.length} question${missing.length>1?"s":""} still unrated.`; document.getElementById("q-" + missing[0].id).scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  const missingV = VALUES.filter(v => !state.values[v.id]);
  if (missingV.length){ err.textContent = `${missingV.length} Meevo value${missingV.length>1?"s":""} still unrated.`; document.getElementById("vq-" + missingV[0].id).scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  const questions = qs.map(q => ({ id:q.id, stage:q.stage, text:q.text, score: state.scores[q.id], reason: (state.reasons[q.id] || "").trim() }));
  const learning = LEARNING.map(l => ({ id:l.id, label:l.label, score: state.learning[l.id] || null, reason: (state.learnReasons[l.id] || "").trim() }));
  const values = VALUES.map(v => ({ id:v.id, name:v.name, score: state.values[v.id] || null, reason: (state.valueReasons[v.id] || "").trim() }));
  const sub = buildSubmission({ name: state.name.trim(), email: state.email.trim(), manager: state.manager.trim(), role: state.role, questions, priorities: state.priorities.filter(Boolean), comments: state.comments.trim(), learning, values });
  if (state.id) sub.id = state.id;
  const wasEditing = state.editing;
  const btn = $("#submitBtn"); btn.disabled = true; btn.textContent = wasEditing ? "Saving…" : "Submitting…";
  try {
    const res = await api.submit(sub);
    if (!res.ok) throw new Error(res.error || "Submission failed");
    sub.id = res.id || sub.id; sub.timestamp = res.timestamp || new Date().toISOString();
    if (adminData){ adminData = adminData.filter(x => x.id !== sub.id); adminData.push(sub); }
    renderConfirmation(sub, wasEditing);
  } catch(e){
    err.textContent = "Could not save: " + e.message; btn.disabled = false; btn.textContent = wasEditing ? "Save my changes" : "Submit my self-assessment";
  }
}

async function adminDelete(id){

async function adminLogin(pw, silent){
  const errEl = $("#pwErr"); if (errEl) errEl.textContent = "Checking…";
  try {

    if (!res.ok) throw new Error(res.error || "Login failed");

    renderAdminDashboard();

async function adminRefresh(){ const res = await api.admin(adminPw); if (res.ok){ adminData = res.submissions; renderAdminDashboard(); toast("Refreshed"); } }

function filteredSubs(){
  let subs = [...adminData].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  if (adminView.role !== "ALL") subs = subs.filter(s => s.role === adminView.role);
  if (adminView.manager) subs = subs.filter(s => (s.manager||"") === adminView.manager);
  if (adminView.latestOnly){ const seen = new Set(); subs = subs.filter(s => { const k = (s.email||s.name).toLowerCase() + "|" + s.role; if (seen.has(k)) return false; seen.add(k); return true; }); }
  return subs;
}

function renderAdminDashboard(){
  if (adminView.rep){ return renderRepDetail(adminView.rep); }
  const subs = filteredSubs();
  const managers = [...new Set([...CONFIG.MANAGERS, ...adminData.map(s => s.manager).filter(Boolean)])].sort();
  const roleKeys = adminView.role === "ALL" ? Object.keys(ROLES) : [adminView.role];

  /* tiles */
  const overall = avg(subs.map(s => s.overall));
  const byRole = Object.keys(ROLES).map(k => { const a = avg(adminData.filter(s => s.role === k).map(s => s.overall)); return `${k} ${fmt(a)}`; }).join(" · ");
  const totalReps = new Set(adminData.map(s => (s.email||s.name).toLowerCase())).size;

  /* training needs: question averages across filtered subs, lowest first */
  const qAgg = {};
  subs.forEach(s => s.questions.forEach(q => { const k = s.role + "|" + q.id; (qAgg[k] ||= { role:s.role, id:q.id, text:q.text, stage:q.stage, scores:[], reasons:[], low:0 }); qAgg[k].scores.push(q.score); if (q.reason) qAgg[k].reasons.push({ who:s.name, r:q.reason, score:q.score }); if (q.score <= 2) qAgg[k].low++; }));
  const needs = Object.values(qAgg).map(x => ({ ...x, avg: avg(x.scores) })).sort((a,b) => a.avg - b.avg);
  const prioCount = {};
  subs.forEach(s => (s.priorities||[]).forEach(p => { const k = s.role + "|" + p; prioCount[k] = (prioCount[k]||0) + 1; }));
  const topPrio = Object.entries(prioCount).sort((a,b) => b[1]-a[1]).slice(0,6).map(([k,c]) => { const [role,id] = k.split("|"); const q = allQuestions(role).find(q => q.id === id); return q ? { role, text:q.text, c } : null; }).filter(Boolean);

  /* stage averages */
  const stageAgg = {};
  subs.forEach(s => Object.entries(s.stageAverages||{}).forEach(([st,v]) => { if (v == null) return; const k = s.role + "|" + st; (stageAgg[k] ||= { role:s.role, stage:st, vals:[] }).vals.push(v); }));
  const stageRows = Object.values(stageAgg).map(x => ({ ...x, avg: avg(x.vals) })).sort((a,b) => a.avg - b.avg);

  app.innerHTML = `
    <div class="admin-head">
      <h1>Team training needs</h1>
      <span class="pill" style="background:var(--ocean-tint);color:var(--ocean)">${adminData.length} submissions · ${totalReps} reps</span>
      <div class="spacer"></div>
      <button class="btn sm" onclick="exportCSV()">Export CSV</button>
      <button class="btn sm" onclick="adminRefresh()">Refresh</button>
      <button class="btn ghost sm" onclick="adminLogout()">Sign out</button>
    </div>
    <div class="filters">
      <div class="seg">${["ALL","SDR","AE","SE","CSM"].map(k => `<button class="${adminView.role===k?'on':''}" onclick="adminView.role='${k}';renderAdminDashboard()">${k==="ALL"?"All roles":k}</button>`).join("")}</div>
      <select onchange="adminView.manager=this.value;renderAdminDashboard()"><option value="">All managers</option>${managers.map(m => `<option ${adminView.manager===m?'selected':''}>${esc(m)}</option>`).join("")}</select>
      <div class="seg"><button class="${adminView.latestOnly?'on':''}" onclick="adminView.latestOnly=true;renderAdminDashboard()">Latest per rep</button><button class="${!adminView.latestOnly?'on':''}" onclick="adminView.latestOnly=false;renderAdminDashboard()">All submissions</button></div>
    </div>
    ${subs.length === 0 ? `<div class="box"><h2>No submissions yet</h2><p class="sub">Share the home page link with the team. Results appear here as they submit.</p></div>` : `
    <div class="tiles">
      <div class="tile"><div class="l">Team average</div><div class="v" style="color:${band(overall).color}">${fmt(overall)}</div><div class="d">${esc(band(overall).label)}</div></div>
      <div class="tile"><div class="l">In this view</div><div class="v">${subs.length}</div><div class="d">${adminView.latestOnly?"reps (latest each)":"submissions"}</div></div>
      <div class="tile"><div class="l">Scores of 1 or 2</div><div class="v">${subs.reduce((n,s)=>n+s.questions.filter(q=>q.score<=2).length,0)}</div><div class="d">individual skill gaps flagged</div></div>
      <div class="tile"><div class="l">Average by role</div><div class="v" style="font-size:19px;margin-top:10px">${byRole}</div><div class="d">all submissions</div></div>
    </div>
    <div class="grid2">
      <div class="box">
        <h2>Biggest training needs</h2><p class="sub">Lowest average self-scores in this view. Start the quarter's plan here.</p>
        ${needs.slice(0,8).map(n => `<div class="hbar" data-tip="${esc(n.reasons.slice(0,3).map(r => `${r.who} (${r.score}): ${r.r}`).join("\n") || "No comments yet")}"><span><span class="pill" style="background:${ROLES[n.role].accent}22;color:${ROLES[n.role].accent}">${n.role}</span> ${esc(n.text)}</span><div class="bg"><i style="width:${(n.avg-1)/4*100}%;background:${heatColor(n.avg)}"></i></div><span class="val">${fmt(n.avg)}</span></div>`).join("")}
      </div>
      <div class="box">
        <h2>What reps are asking for</h2><p class="sub">Most selected top 3 coaching priorities.</p>
        ${topPrio.length ? topPrio.map(p => `<div class="hbar"><span><span class="pill" style="background:${ROLES[p.role].accent}22;color:${ROLES[p.role].accent}">${p.role}</span> ${esc(p.text)}</span><div class="bg"><i style="width:${p.c/subs.length*100}%;background:var(--terra)"></i></div><span class="val">${p.c}</span></div>`).join("") : `<p class="sub">No priorities selected yet.</p>`}
        <h2 style="margin-top:18px">Stage averages</h2><p class="sub">Lowest first.</p>
        ${stageRows.slice(0,8).map(r => `<div class="hbar"><span><span class="pill" style="background:${ROLES[r.role].accent}22;color:${ROLES[r.role].accent}">${r.role}</span> ${esc(r.stage)}</span><div class="bg"><i style="width:${(r.avg-1)/4*100}%;background:${heatColor(r.avg)}"></i></div><span class="val">${fmt(r.avg)}</span></div>`).join("")}
      </div>
    </div>
    ${roleKeys.map(rk => renderHeatmap(rk, subs.filter(s => s.role === rk))).join("")}
    ${renderValues(subs)}
    ${renderLearning(subs)}
    <div class="box">
      <h2>Individual reps</h2><p class="sub">Click a rep to see every score and comment.</p>
      <div class="reps">${subs.map(s => `<div class="rep" onclick="adminView.rep='${esc(s.id)}';renderAdminDashboard()"><div class="n">${esc(s.name)}</div><div class="m">${s.role} · ${esc(s.manager||"no manager listed")} · ${fmtDate(s.timestamp)}</div><div class="s" style="color:${band(s.overall).color}">${fmt(s.overall)}</div>
        <div class="rep-actions" onclick="event.stopPropagation()"><button class="btn ghost sm" onclick="editSubmission(adminData.find(x=>x.id==='${esc(s.id)}'))">Edit scores</button><button class="btn ghost sm danger-btn" onclick="adminDelete('${esc(s.id)}')">Delete</button></div></div>`).join("")}</div>
    </div>`}`;
  bindTips();
}

function renderValues(subs){
  const rows = VALUES.map(v => {
    const items = subs.flatMap(s => (s.values||[]).filter(x => x.id === v.id && x.score));
    return { v, avg: avg(items.map(x => x.score)), n: items.length, low: items.filter(x => x.score <= 2).length, reasons: items.filter(x => x.reason).slice(0,4).map(x => { const who = subs.find(s => (s.values||[]).includes(x)); return `${who ? who.name : ""} (${x.score}): ${x.reason}`; }) };
  }).filter(r => r.n).sort((a,b) => a.avg - b.avg);
  if (!rows.length) return "";
  const overall = avg(subs.map(s => s.valuesOverall).filter(x => x != null));
  const byRole = Object.keys(ROLES).map(k => { const a = avg(subs.filter(s => s.role === k).map(s => s.valuesOverall).filter(x => x != null)); return a == null ? null : `${k} ${fmt(a)}`; }).filter(Boolean).join(" · ");
  return `<div class="box" style="margin-bottom:18px;border-top:4px solid var(--terra)">
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><h2>Living the Meevo values</h2><span class="pill" style="background:var(--terra-light);color:#5F3A1F">Team ${fmt(overall)} / 5</span><span style="font-size:13px;color:var(--ink3)">${byRole}</span></div>
    <p class="sub">How consistently reps say they live each value. Lowest first. Hover a bar for examples in their own words. Scored separately from sales skills.</p>
    ${rows.map(r => `<div class="hbar" data-tip="${esc(r.reasons.join("\n") || "No comments yet")}"><span>${esc(r.v.name)} <span style="color:var(--ink3);font-size:12.5px">(${r.low} of ${r.n} at 2 or below)</span></span><div class="bg"><i style="width:${(r.avg-1)/4*100}%;background:var(--terra)"></i></div><span class="val">${fmt(r.avg)}</span></div>`).join("")}
  </div>`;
}

function renderLearning(subs){
  const rows = LEARNING.map(l => {
    const items = subs.flatMap(s => (s.learning||[]).filter(x => x.id === l.id && x.score));
    return { l, avg: avg(items.map(x => x.score)), n: items.length, best: items.filter(x => x.score >= 4).length, reasons: items.filter(x => x.reason).slice(0,4) };
  }).filter(r => r.n).sort((a,b) => b.avg - a.avg);
  if (!rows.length) return "";
  return `<div class="box" style="margin-bottom:18px">
    <h2>How the team likes to learn</h2><p class="sub">Average preference per format, 1 to 5. Hover a bar for what reps said. Use this to decide delivery format, not just content.</p>
    ${rows.map(r => `<div class="hbar" data-tip="${esc(r.reasons.map(x => `${x.reason}`).join("\n") || "No comments yet")}"><span>${esc(r.l.label)} <span style="color:var(--ink3);font-size:12.5px">(${r.best} of ${r.n} rate it 4+)</span></span><div class="bg"><i style="width:${(r.avg-1)/4*100}%;background:var(--terra)"></i></div><span class="val">${fmt(r.avg)}</span></div>`).join("")}
  </div>`;
}

function renderHeatmap(roleKey, subs){
  if (!subs.length) return "";
  const role = ROLES[roleKey]; const qs = allQuestions(roleKey);
  const cols = subs.map(s => { const m = {}; s.questions.forEach(q => m[q.id] = q); return { s, m }; });
  return `<div class="box" style="margin-bottom:18px">
    <h2>${esc(role.name)} skills heatmap</h2><p class="sub">Each cell is one rep's self-score. Rows sorted by team average, lowest first. Hover a cell for the rep's comment.</p>
    <div class="heat"><table>
      <thead><tr><th>Skill</th><th>Team</th>${cols.map(c => `<th class="rot">${esc(c.s.name)}</th>`).join("")}</tr></thead>
      <tbody>${qs.map(q => ({ q, a: avg(cols.map(c => c.m[q.id]?.score)) })).sort((x,y) => x.a - y.a).map(({q,a}) => `
        <tr><td class="lab" title="${esc(q.text)}"><span style="color:var(--ink3);font-weight:600;font-size:11.5px">${esc(q.stage)}</span><br>${esc(q.text)}</td>
        <td class="avg" style="background:${heatColor(a)};color:${heatInk(a)}">${fmt(a)}</td>
        ${cols.map(c => { const x = c.m[q.id]; return `<td style="background:${heatColor(x?.score)};color:${heatInk(x?.score)}" data-tip="${esc(c.s.name)} · ${x?.score ?? "–"}${x?.reason ? "\n" + esc(x.reason) : ""}">${x?.score ?? ""}</td>`; }).join("")}</tr>`).join("")}
      </tbody></table></div>
    <div class="legend">Low ${HEAT.map(h => `<i style="background:${h}"></i>`).join("")} High</div>
  </div>`;
}

function renderRepDetail(id){
  const s = adminData.find(x => x.id === id); if (!s){ adminView.rep = null; return renderAdminDashboard(); }
  const role = ROLES[s.role]; const b = band(s.overall);
  const history = adminData.filter(x => (x.email||x.name).toLowerCase() === (s.email||s.name).toLowerCase() && x.role === s.role).sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
  const prioText = (s.priorities||[]).map(p => allQuestions(s.role).find(q => q.id === p)?.text).filter(Boolean);
  app.innerHTML = `
    <div class="crumbs"><a href="#/admin" onclick="adminView.rep=null;renderAdminDashboard();return false">Team view</a> › ${esc(s.name)}</div>
    <div class="admin-head"><h1 style="color:${role.accent}">${esc(s.name)}</h1><span class="pill" style="background:${role.accent}22;color:${role.accent}">${role.name}</span><span style="color:var(--ink3)">${esc(s.manager||"")} · ${fmtDate(s.timestamp)} · ${esc(s.email||"")}</span>
      <div class="spacer"></div>
      <button class="btn sm" onclick="editSubmission(adminData.find(x=>x.id==='${esc(s.id)}'))">Edit answers</button>
      <button class="btn ghost sm" style="color:#A3412F;border-color:#A3412F" onclick="adminDelete('${esc(s.id)}')">Delete submission</button>
    </div>
    <div class="meter-wrap" style="position:static;margin-bottom:18px">
      <div><div class="label">Overall</div><div class="hero-num">${fmt(s.overall)}<small> / 5</small></div></div>
      <div><div class="track"><div class="fill" style="width:${(s.overall-1)/4*100}%;background:${b.color}"></div></div><div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><div class="band" style="color:${b.color}">${b.label}</div></div>
      <div class="progress"><b>${history.length}</b>submission${history.length>1?"s":""}</div>
      ${history.length > 1 ? `<div class="stage-mini">${history.map(h => `<span><i style="background:${heatColor(h.overall)}"></i>${fmtDate(h.timestamp)} <b>${fmt(h.overall)}</b></span>`).join("")}</div>` : ""}
    </div>
    <div class="grid2">
      <div class="box"><h2>By stage</h2><p class="sub">Lowest first.</p>${Object.entries(s.stageAverages).sort((a,b)=>a[1]-b[1]).map(([n,v]) => `<div class="hbar"><span>${esc(n)}</span><div class="bg"><i style="width:${(v-1)/4*100}%;background:${heatColor(v)}"></i></div><span class="val">${fmt(v)}</span></div>`).join("")}</div>
      <div class="box"><h2>Top 3 coaching priorities</h2><p class="sub">Chosen by the rep.</p>${prioText.length ? `<ol class="list">${prioText.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : `<p class="sub">None selected.</p>`}
        ${s.comments ? `<h2 style="margin-top:14px;font-size:16px">Anything else</h2><p style="margin:0;color:var(--ink2)">${esc(s.comments)}</p>` : ""}
        ${(s.values||[]).some(v => v.score) ? `<h2 style="margin-top:14px;font-size:16px">Living the Meevo values · ${fmt(s.valuesOverall)} / 5</h2>${[...s.values].filter(v => v.score).sort((a,b) => a.score - b.score).map(v => `<div class="hbar"><span>${esc(v.name)}</span><div class="bg"><i style="width:${(v.score-1)/4*100}%;background:var(--terra)"></i></div><span class="val">${v.score}</span></div>${v.reason ? `<p style="margin:0 0 8px;font-size:13.5px;color:var(--ink2)">${esc(v.reason)}</p>` : ""}`).join("")}` : ""}
        ${(s.learning||[]).some(l => l.score) ? `<h2 style="margin-top:14px;font-size:16px">How ${esc(s.name.split(" ")[0])} likes to learn</h2>${[...s.learning].filter(l => l.score).sort((a,b) => b.score - a.score).map(l => `<div class="hbar"><span>${esc(l.label)}</span><div class="bg"><i style="width:${(l.score-1)/4*100}%;background:var(--terra)"></i></div><span class="val">${l.score}</span></div>${l.reason ? `<p style="margin:0 0 8px;font-size:13.5px;color:var(--ink2)">${esc(l.reason)}</p>` : ""}`).join("")}` : ""}</div>
    </div>
    <div class="box"><h2>All responses</h2><p class="sub">Sorted lowest to highest so coaching conversations start in the right place.</p>
      <table class="detail"><thead><tr><th>Score</th><th>Stage</th><th>Skill</th><th>Why this score</th></tr></thead>
      <tbody>${[...s.questions].sort((a,b)=>a.score-b.score).map(q => `<tr><td class="sc" style="background:${heatColor(q.score)};color:${heatInk(q.score)}">${q.score}</td><td style="color:var(--ink3);font-size:13.5px;white-space:nowrap">${esc(q.stage)}</td><td>${esc(q.text)}</td><td style="color:var(--ink2)">${esc(q.reason||"")}</td></tr>`).join("")}</tbody></table>
    </div>`;
}

function exportCSV(){
  const rows = [["Timestamp","Name","Email","Role","Manager","Overall","Stage","QuestionId","Question","Score","Reason","Priorities","Comments"]];
  filteredSubs().forEach(s => { s.questions.forEach(q => rows.push([s.timestamp,s.name,s.email,s.role,s.manager,fmt(s.overall),q.stage,q.id,q.text,q.score,q.reason,(s.priorities||[]).join(" | "),s.comments])); (s.learning||[]).forEach(l => rows.push([s.timestamp,s.name,s.email,s.role,s.manager,fmt(s.overall),"How I like to learn",l.id,l.label,l.score ?? "",l.reason,"",""])); (s.values||[]).forEach(v => rows.push([s.timestamp,s.name,s.email,s.role,s.manager,fmt(s.overall),"Meevo values",v.id,v.name,v.score ?? "",v.reason,"",""])); });
  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" })); a.download = `meevo-tna-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

/* tooltips */
function bindTips(){
  const tip = $("#tooltip");
  document.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mouseenter", () => { tip.textContent = el.dataset.tip; tip.style.whiteSpace = "pre-line"; tip.classList.remove("hidden"); });
    el.addEventListener("mousemove", e => { tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 340) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
    el.addEventListener("mouseleave", () => tip.classList.add("hidden"));
  });
}
</script>

</body>
</html>
